<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ร้านค้าออนไลน์</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            color: #667eea;
            font-size: 28px;
        }

        .cart-icon {
            position: relative;
            cursor: pointer;
            background: #667eea;
            color: white;
            padding: 12px 25px;
            border-radius: 25px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .cart-icon:hover {
            background: #764ba2;
            transform: translateY(-2px);
        }

        .cart-count {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #ff4757;
            color: white;
            border-radius: 50%;
            width: 25px;
            height: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
        }

        .main-content {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        .products-section {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .product-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 15px;
            transition: all 0.3s;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
            border-color: #667eea;
        }

        .product-image {
            width: 100%;
            height: 150px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            margin-bottom: 10px;
        }

        .product-name {
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .product-price {
            color: #667eea;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .add-to-cart-btn {
            width: 100%;
            background: #667eea;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .add-to-cart-btn:hover {
            background: #764ba2;
        }

        .cart-section {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            position: sticky;
            top: 20px;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
        }

        .cart-section h2 {
            color: #667eea;
            margin-bottom: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .cart-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-item-details {
            flex: 1;
        }

        .cart-item-name {
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .cart-item-price {
            color: #667eea;
            font-size: 14px;
        }

        .cart-item-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .qty-btn {
            background: #667eea;
            color: white;
            border: none;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
        }

        .qty-btn:hover {
            background: #764ba2;
        }

        .qty-display {
            font-weight: bold;
            min-width: 30px;
            text-align: center;
        }

        .remove-btn {
            background: #ff4757;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
        }

        .remove-btn:hover {
            background: #ff3838;
        }

        .cart-summary {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #e0e0e0;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .summary-row.total {
            font-size: 20px;
            font-weight: bold;
            color: #667eea;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 2px solid #667eea;
        }

        .checkout-btn {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            margin-top: 15px;
            transition: all 0.3s;
        }

        .checkout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .empty-cart {
            text-align: center;
            color: #999;
            padding: 30px;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .cart-section {
                position: relative;
                top: 0;
                max-height: none;
            }

            .products-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🛒 ร้านค้าออนไลน์</h1>
            <div class="cart-icon" onclick="scrollToCart()">
                ตระกร้าสินค้า
                <span class="cart-count" id="cartCount">0</span>
            </div>
        </header>

        <div class="main-content">
            <div class="products-section">
                <h2>สินค้าทั้งหมด</h2>
                <div class="products-grid" id="productsGrid"></div>
            </div>

            <div class="cart-section" id="cartSection">
                <h2>🛍️ ตระกร้าสินค้า</h2>
                <div id="cartItems"></div>
                <div class="cart-summary" id="cartSummary" style="display: none;">
                    <div class="summary-row">
                        <span>รวมสินค้า:</span>
                        <span id="totalItems">0 รายการ</span>
                    </div>
                    <div class="summary-row total">
                        <span>ยอดรวมทั้งหมด:</span>
                        <span id="totalPrice">฿0</span>
                    </div>
                    <button class="checkout-btn" onclick="checkout()">ชำระเงิน</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ข้อมูลสินค้า
        const products = [
            { id: 1, name: 'มือถือสมาร์ทโฟน', price: 8990, emoji: '📱' },
            { id: 2, name: 'แล็ปท็อป', price: 25990, emoji: '💻' },
            { id: 3, name: 'หูฟังบลูทูธ', price: 1590, emoji: '🎧' },
            { id: 4, name: 'นาฬิกาสมาร์ทวอทช์', price: 3490, emoji: '⌚' },
            { id: 5, name: 'กล้องดิจิตอล', price: 15990, emoji: '📷' },
            { id: 6, name: 'เมาส์ไร้สาย', price: 590, emoji: '🖱️' },
            { id: 7, name: 'คีย์บอร์ดเกมมิ่ง', price: 1890, emoji: '⌨️' },
            { id: 8, name: 'ลำโพงบลูทูธ', price: 990, emoji: '🔊' }
        ];

        // ตะกร้าสินค้า
        let cart = [];

        // แสดงสินค้าทั้งหมด
        function displayProducts() {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = products.map(product => `
                <div class="product-card">
                    <div class="product-image">${product.emoji}</div>
                    <div class="product-name">${product.name}</div>
                    <div class="product-price">฿${product.price.toLocaleString()}</div>
                    <button class="add-to-cart-btn" onclick="addToCart(${product.id})">
                        เพิ่มลงตระกร้า
                    </button>
                </div>
            `).join('');
        }

        // เพิ่มสินค้าลงตระกร้า
        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const existingItem = cart.find(item => item.id === productId);

            if (existingItem) {
                existingItem.quantity++;
            } else {
                cart.push({ ...product, quantity: 1 });
            }

            updateCart();
        }

        // ลบสินค้าออกจากตระกร้า
        function removeFromCart(productId) {
            cart = cart.filter(item => item.id !== productId);
            updateCart();
        }

        // เพิ่มจำนวนสินค้า
        function increaseQty(productId) {
            const item = cart.find(item => item.id === productId);
            if (item) {
                item.quantity++;
                updateCart();
            }
        }

        // ลดจำนวนสินค้า
        function decreaseQty(productId) {
            const item = cart.find(item => item.id === productId);
            if (item) {
                if (item.quantity > 1) {
                    item.quantity--;
                } else {
                    removeFromCart(productId);
                }
                updateCart();
            }
        }

        // อัพเดทตระกร้า
        function updateCart() {
            const cartItemsDiv = document.getElementById('cartItems');
            const cartCount = document.getElementById('cartCount');
            const cartSummary = document.getElementById('cartSummary');

            // นับจำนวนสินค้าทั้งหมด
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            cartCount.textContent = totalItems;

            // ถ้าตระกร้าว่าง
            if (cart.length === 0) {
                cartItemsDiv.innerHTML = '<div class="empty-cart">🛒 ตระกร้าว่างเปล่า<br>เริ่มเลือกสินค้าเลย!</div>';
                cartSummary.style.display = 'none';
                return;
            }

            // แสดงสินค้าในตระกร้า
            cartItemsDiv.innerHTML = cart.map(item => `
                <div class="cart-item">
                    <div class="cart-item-details">
                        <div class="cart-item-name">${item.emoji} ${item.name}</div>
                        <div class="cart-item-price">฿${item.price.toLocaleString()} x ${item.quantity}</div>
                    </div>
                    <div class="cart-item-controls">
                        <button class="qty-btn" onclick="decreaseQty(${item.id})">-</button>
                        <span class="qty-display">${item.quantity}</span>
                        <button class="qty-btn" onclick="increaseQty(${item.id})">+</button>
                        <button class="remove-btn" onclick="removeFromCart(${item.id})">ลบ</button>
                    </div>
                </div>
            `).join('');

            // คำนวณยอดรวม
            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            
            document.getElementById('totalItems').textContent = `${totalItems} รายการ`;
            document.getElementById('totalPrice').textContent = `฿${totalPrice.toLocaleString()}`;
            cartSummary.style.display = 'block';
        }

        // เลื่อนไปที่ตระกร้า
        function scrollToCart() {
            document.getElementById('cartSection').scrollIntoView({ behavior: 'smooth' });
        }

        // ชำระเงิน
        function checkout() {
            if (cart.length === 0) {
                alert('กรุณาเลือกสินค้าก่อนชำระเงิน');
                return;
            }

            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const itemList = cart.map(item => `${item.name} x${item.quantity}`).join('\n');
            
            alert(`🎉 ขอบคุณที่สั่งซื้อ!\n\nรายการสินค้า:\n${itemList}\n\nยอดรวม: ฿${totalPrice.toLocaleString()}`);
            
            cart = [];
            updateCart();
        }

        // เริ่มต้น
        displayProducts();
        updateCart();
    </script>
</body>
</html>
